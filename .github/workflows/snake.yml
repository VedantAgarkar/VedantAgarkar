name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VedantAgarkar
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF7A00&color_dots=#161B22,#3B2415,#7A451D,#C96A1B,#FF7A00
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF7A00&color_dots=#2d3343,#3B2415,#7A451D,#C96A1B,#FF7A00

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
